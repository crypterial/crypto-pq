[package]
name = "crypto-pq"
version = "0.2.0-dev.0"
edition = "2024"
rust-version = "1.88"
description = "Post-quantum cryptography in pure Rust, with no dependencies."
license = "Apache-2.0 OR MIT"
homepage = "https://crypterial.com"
repository = "https://github.com/crypterial/crypto-pq"
keywords = ["post-quantum", "cryptography", "ml-kem", "ml-dsa", "sha3"]
categories = ["cryptography", "no-std"]
include = ["/src", "/LICENSE-APACHE", "/LICENSE-MIT"]

[[bench]]
name = "bench"
harness = false

# The SLH-DSA, XMSS and LMS vector suites take minutes unoptimized; test builds keep their debug
# assertions and overflow checks but are optimized.
[profile.test]
opt-level = 3
