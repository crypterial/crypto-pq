[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "crypto-pq"
version = "0.2.0.dev0"
description = "Post-quantum cryptography in pure Python, with no dependencies."
license = "Apache-2.0 OR MIT"
requires-python = ">=3.11"
authors = [{ name = "Wilson Tran" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://crypterial.com"
Repository = "https://github.com/crypterial/crypto-pq"
