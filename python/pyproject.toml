[build-system]
requires = []
build-backend = "cpq_build"
backend-path = ["build_backend"]

[project]
name = "crypto-pq"
version = "0.2.0.dev0"
description = "Post-quantum cryptography with no dependencies: crypto-pq's own native core in the platform wheels, pure Python everywhere else."
license = "Apache-2.0 OR MIT"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
requires-python = ">=3.11"
authors = [{ name = "Wilson Tran" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://crypterial.com"
Repository = "https://github.com/crypterial/crypto-pq"
