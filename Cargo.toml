[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/crypterial/crypto-pq"
authors = ["Wilson Tran"]

[profile.release]
debug = false
overflow-checks = true

[profile.test]
opt-level = 3
