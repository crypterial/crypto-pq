name: ci

on:
  push:
    branches: [main]
  pull_request:

# Only GitHub's own actions, pinned to commits (the repo setting "require SHA pinning" enforces
# it); the token is read-only. Jobs for each implementation are added as the code lands.
permissions:
  contents: read

jobs:
  vectors:
    name: test vectors are unmodified
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cd vectors && sha256sum -c SHA256SUMS
