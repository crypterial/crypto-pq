name: ci

on:
  push:
    branches: [main]
  pull_request:

# Only GitHub's own actions, pinned to commits (the repo setting "require SHA pinning" enforces
# it); the token is read-only. Toolchains come from their official distributions.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The same bash steps on every platform; Windows runs them in Git Bash. A job that sets its own
# defaults replaces these, so those jobs repeat the shell.
defaults:
  run:
    shell: bash

jobs:
  vectors:
    name: test vectors are unmodified
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cd vectors && sha256sum -c SHA256SUMS

  # vectors/cross holds what the Python reference produces; regenerating it must change nothing.
  cross-vectors:
    name: cross vectors match the Python reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: python tools/cross_vectors.py
        env:
          PYTHONPATH: python/src
      - run: git diff --exit-code -- vectors

  # Every language runs its full suite on x86-64 and arm64 Linux, macOS and Windows; the extra
  # toolchain versions run on x86-64 Linux only.
  python:
    name: python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.x"]
        include:
          - { os: ubuntu-24.04-arm, python: "3.x" }
          - { os: macos-latest, python: "3.x" }
          - { os: windows-latest, python: "3.x" }
    defaults:
      run:
        shell: bash
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

  rust:
    name: rust ${{ matrix.rust }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        rust: ["1.88", stable]
        include:
          - { os: ubuntu-24.04-arm, rust: stable }
          - { os: macos-latest, rust: stable }
          - { os: windows-latest, rust: stable }
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - run: rustup override set ${{ matrix.rust }}
      - run: cargo test --locked
      - run: cargo test --locked --release

  typescript:
    name: typescript node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["22", "24", "26"]
        include:
          - { os: ubuntu-24.04-arm, node: "24" }
          - { os: macos-latest, node: "24" }
          - { os: windows-latest, node: "24" }
    defaults:
      run:
        shell: bash
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node tools/generate.ts --check
      - run: npm test
      - run: npm run build

  go:
    name: go ${{ matrix.go }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ["1.25", stable]
        include:
          - { os: ubuntu-24.04-arm, go: stable }
          - { os: macos-latest, go: stable }
          - { os: windows-latest, go: stable }
          - { os: windows-11-arm, go: stable }
    defaults:
      run:
        shell: bash
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)"
      # The committed assembly must be exactly what internal/asmgen writes.
      - if: matrix.os == 'ubuntu-latest'
        run: go run ./internal/asmgen -check
      - run: go vet ./...
      # go vet's asmdecl checks every assembly function's frame against its Go declaration;
      # -dynlink makes the assembler reject R15 used after a global access.
      - if: matrix.os == 'ubuntu-latest'
        run: |
          for arch in amd64 arm64 386 s390x riscv64; do GOARCH=$arch go vet ./...; done
          GOARCH=amd64 GOAMD64=v3 go vet ./...
          go vet -tags purego ./...
          GOOS=darwin GOARCH=arm64 go vet ./...
          GOOS=windows GOARCH=arm64 go vet ./...
          GOOS=freebsd GOARCH=arm64 go vet ./...
          GOOS=android GOARCH=arm64 go vet ./...
          GOARCH=amd64 go build -asmflags=-dynlink ./...
          GOARCH=arm64 go build -asmflags=-dynlink ./...
      - run: go test -v -run TestKernelSelection .
      # The race detector needs cgo, which the Windows runners have no C compiler set up for.
      - if: runner.os != 'Windows'
        run: go test -race ./...
      - if: runner.os == 'Windows'
        run: go test ./...
      # GOAMD64=v3 selects the AVX2 kernels at compile time instead of at run time.
      - if: matrix.os == 'ubuntu-latest'
        run: GOAMD64=v3 go test ./...

  zig:
    name: zig 0.16.0 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: zig-x86_64-linux-0.16.0.tar.xz
            sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
            cpu: baseline
          - os: ubuntu-24.04-arm
            archive: zig-aarch64-linux-0.16.0.tar.xz
            sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
            cpu: generic
          - os: macos-latest
            archive: zig-aarch64-macos-0.16.0.tar.xz
            sha256: b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489
            cpu: generic
          - os: windows-latest
            archive: zig-x86_64-windows-0.16.0.zip
            sha256: 68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e
            cpu: baseline
    defaults:
      run:
        shell: bash
        working-directory: zig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ziglang.org asks automated downloads to stay rare, so the archive is cached; it is
      # checked against the SHA-256 that ziglang.org/download/index.json publishes either way.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/${{ matrix.archive }}
          key: ${{ matrix.archive }}
      - run: |
          archive="$HOME/${{ matrix.archive }}"
          [ -f "$archive" ] || curl -fsSL --proto '=https' -o "$archive" "https://ziglang.org/download/0.16.0/${{ matrix.archive }}"
          actual=$({ sha256sum "$archive" 2>/dev/null || shasum -a 256 "$archive"; } | cut -d' ' -f1)
          [ "$actual" = "${{ matrix.sha256 }}" ]
          mkdir -p ~/zig
          if [ "$RUNNER_OS" = Windows ]; then
            7z x -bd -y -o"$(cygpath -w ~/unpacked)" "$(cygpath -w "$archive")" > /dev/null
            mv ~/unpacked/*/* ~/zig/
            cygpath -w ~/zig >> "$GITHUB_PATH"
          else
            tar -xJf "$archive" -C ~/zig --strip-components=1
            echo ~/zig >> "$GITHUB_PATH"
          fi
      - if: matrix.os == 'ubuntu-latest'
        run: zig fmt --check .
      # Debug builds take a quarter of an hour, so they run once; the other platforms run the
      # optimized modes, which keep or drop the safety checks. Debug on x86-64 uses Zig's own
      # code generator, which takes the portable code.
      - if: matrix.os == 'ubuntu-latest'
        run: zig build test --summary all
      - run: zig build test -Doptimize=ReleaseSafe --summary all
      # The native CPU: features the runner's CPU model guarantees are chosen at compile time.
      - run: zig build test -Doptimize=ReleaseFast --summary all
      # A CPU model that guarantees none of the features, so every one is detected at run time
      # (CPUID, HWCAP, sysctl): generic on AArch64, where Zig's baseline for macOS is apple_m1;
      # the x86-64 baseline on x86-64, where the generic model lacks even SSE.
      - run: zig build test -Doptimize=ReleaseFast -Dcpu=${{ matrix.cpu }} --summary all
      # The forced-portable build: the fallback stays tested on every platform.
      - run: zig build test -Doptimize=ReleaseFast -Dportable=true --summary all

  # Windows on Arm, the only runner that takes IsProcessorFeaturePresent's path. Zig 0.16.0's own
  # aarch64-windows build crashes at startup there, so the x86-64 compiler runs under emulation
  # and builds the tests for aarch64-windows; the test binaries then run natively.
  zig-windows-arm:
    name: zig 0.16.0 (windows-11-arm)
    runs-on: windows-11-arm
    defaults:
      run:
        shell: bash
        working-directory: zig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/zig-x86_64-windows-0.16.0.zip
          key: zig-x86_64-windows-0.16.0.zip
      - run: |
          archive="$HOME/zig-x86_64-windows-0.16.0.zip"
          [ -f "$archive" ] || curl -fsSL --proto '=https' -o "$archive" https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip
          [ "$(sha256sum "$archive" | cut -d' ' -f1)" = 68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e ]
          mkdir -p ~/zig
          7z x -bd -y -o"$(cygpath -w ~/unpacked)" "$(cygpath -w "$archive")" > /dev/null
          mv ~/unpacked/*/* ~/zig/
          cygpath -w ~/zig >> "$GITHUB_PATH"
      - run: |
          for flags in "-Doptimize=ReleaseSafe" "-Doptimize=ReleaseFast" "-Doptimize=ReleaseFast -Dcpu=generic" "-Doptimize=ReleaseFast -Dportable=true"; do
            rm -rf zig-out
            zig build test-binaries -Dtarget=aarch64-windows $flags
            for binary in zig-out/bin/*.exe; do
              echo "== $binary ($flags)"
              "$binary"
            done
          done

  # The kernels on CPU models the runners do not have, under qemu user mode: x86-64 without
  # SHA-NI, without AVX2, and without either; AArch64 with only the v8.0 SHA-2 instructions, and
  # with everything (whose MIDR names no Apple core, so dispatch keeps the scalar Keccak while the
  # tests still run the SHA3 kernels). The binary runs under qemu with an explicit -cpu, and the
  # job counts the architecture's kernel tests that ran: a skipped kernel would otherwise pass
  # unnoticed.
  zig-cpu-models:
    name: zig kernels on ${{ matrix.arch }} ${{ matrix.cpu }} (qemu)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04-arm, archive: zig-aarch64-linux-0.16.0.tar.xz, sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17, arch: x86_64, cpu: "max", kernels: 3 }
          - { runner: ubuntu-24.04-arm, archive: zig-aarch64-linux-0.16.0.tar.xz, sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17, arch: x86_64, cpu: "max,-sha-ni", kernels: 2 }
          - { runner: ubuntu-24.04-arm, archive: zig-aarch64-linux-0.16.0.tar.xz, sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17, arch: x86_64, cpu: "max,-avx2", kernels: 1 }
          - { runner: ubuntu-24.04-arm, archive: zig-aarch64-linux-0.16.0.tar.xz, sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17, arch: x86_64, cpu: "qemu64", kernels: 0 }
          - { runner: ubuntu-latest, archive: zig-x86_64-linux-0.16.0.tar.xz, sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00, arch: aarch64, cpu: "cortex-a57", kernels: 4 }
          - { runner: ubuntu-latest, archive: zig-x86_64-linux-0.16.0.tar.xz, sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00, arch: aarch64, cpu: "max", kernels: 6 }
    defaults:
      run:
        shell: bash
        working-directory: zig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/${{ matrix.archive }}
          key: ${{ matrix.archive }}
      - run: |
          archive="$HOME/${{ matrix.archive }}"
          [ -f "$archive" ] || curl -fsSL --proto '=https' -o "$archive" "https://ziglang.org/download/0.16.0/${{ matrix.archive }}"
          echo "${{ matrix.sha256 }}  $archive" | sha256sum -c -
          mkdir -p ~/zig && tar -xJf "$archive" -C ~/zig --strip-components=1
          echo ~/zig >> "$GITHUB_PATH"
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends qemu-user
      # The whole suite would take an hour under emulation; the kernels' differential tests
      # (20,000 random inputs each, and edge cases) take seconds.
      - run: zig build test-binaries -Dtarget=${{ matrix.arch }}-linux -Dcpu=baseline -Doptimize=ReleaseFast
      - run: |
          out=$(qemu-${{ matrix.arch }} -cpu "${{ matrix.cpu }}" zig-out/bin/kernels 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          ran=$(echo "$out" | grep -cE '^[0-9]+/[0-9]+ cpu_test\.test\.(x86-64|AArch64) .*\.\.\.OK$' || true)
          echo "kernel tests run: $ran, expected ${{ matrix.kernels }}"
          [ "$ran" = "${{ matrix.kernels }}" ]

  # 32-bit, big-endian and RISC-V targets, all but x86 under qemu: the code has no word-size or
  # byte-order assumptions, and these runs keep it that way; RISC-V runs the portable code, which
  # a compiler bug there once broke. JavaScript and Python expose neither, so their jobs above
  # cover them.
  go-cross:
    name: go ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: ["386", s390x, riscv64]
    defaults:
      run:
        shell: bash
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - if: matrix.goarch != '386'
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends qemu-user
      - if: matrix.goarch == '386'
        run: GOARCH=386 go test ./...
      # Emulation is about twenty times slower, past go test's default ten-minute limit.
      - if: matrix.goarch != '386'
        run: GOARCH=${{ matrix.goarch }} go test -timeout 60m -exec qemu-${{ matrix.goarch }} ./...

  rust-cross:
    name: rust ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686-unknown-linux-gnu
            packages: gcc-multilib
          - target: s390x-unknown-linux-gnu
            packages: gcc-s390x-linux-gnu libc6-dev-s390x-cross qemu-user
          - target: riscv64gc-unknown-linux-gnu
            packages: gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user
    defaults:
      run:
        shell: bash
        working-directory: rust
    env:
      CARGO_TARGET_S390X_UNKNOWN_LINUX_GNU_LINKER: s390x-linux-gnu-gcc
      CARGO_TARGET_S390X_UNKNOWN_LINUX_GNU_RUNNER: qemu-s390x -L /usr/s390x-linux-gnu
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_RUNNER: qemu-riscv64 -L /usr/riscv64-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -q && sudo apt-get install -yq ${{ matrix.packages }}
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --locked --release --target ${{ matrix.target }}

  zig-cross:
    name: zig ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: [x86-linux, s390x-linux, riscv64-linux]
    defaults:
      run:
        shell: bash
        working-directory: zig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/zig-x86_64-linux-0.16.0.tar.xz
          key: zig-x86_64-linux-0.16.0.tar.xz
      - run: |
          archive=~/zig-x86_64-linux-0.16.0.tar.xz
          [ -f "$archive" ] || curl -fsSL --proto '=https' -o "$archive" https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $archive" | sha256sum -c -
          mkdir -p ~/zig && tar -xJf "$archive" -C ~/zig --strip-components=1
          echo ~/zig >> "$GITHUB_PATH"
      - if: matrix.target == 's390x-linux'
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends qemu-user
      - if: matrix.target != 'riscv64-linux'
        run: zig build test -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} -fqemu --summary all
      # Ubuntu 24.04's QEMU 8.2 crashes in the two largest RISC-V test binaries at the test
      # runner's first write, before any library code runs; QEMU 10 runs them all.
      - if: matrix.target == 'riscv64-linux'
        run: |
          zig build test-binaries -Doptimize=ReleaseSafe -Dtarget=riscv64-linux
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w/zig debian:trixie-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a sh -c 'apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 update -q > /dev/null && apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 install -yq --no-install-recommends qemu-user > /dev/null && for binary in zig-out/bin/*; do echo "== $binary"; qemu-riscv64 "$binary" || exit 1; done'

  # The packages that would be published build from their declared contents alone.
  package:
    name: packages build cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: rust crate
        working-directory: rust
        run: |
          cargo package --locked
          cargo package --locked --list
      - name: npm package
        working-directory: typescript
        run: |
          npm ci --ignore-scripts
          npm run build
          npm pack --dry-run --json > pack.json
          node -e '
            const files = JSON.parse(require("fs").readFileSync("pack.json", "utf8"))[0].files.map((f) => f.path);
            const stray = files.filter((p) => !/^(dist\/|LICENSE-|package\.json$)/.test(p));
            console.log(files.join("\n"));
            if (stray.length) throw new Error("unexpected files: " + stray.join(", "));
          '
      - name: python wheel
        working-directory: python
        run: |
          python -m pip wheel . --no-deps -w "$RUNNER_TEMP/wheel"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP"/wheel/*.whl
          cd "$RUNNER_TEMP" && venv/bin/python -c '
          import crypto_pq
          pair = crypto_pq.ML_KEM_768.generate_key_pair()
          sealed = pair.public_key.encapsulate()
          assert pair.private_key.decapsulate(sealed.ciphertext) == sealed.shared_secret
          print(crypto_pq.__name__, "wheel OK")
          '

  # fmt and clippy on both toolchains and every cfg. The cross-target clippy runs lint the other
  # architecture's kernels (cpu/aarch64*, cpu/x86_64.rs) and the Windows and macOS detection,
  # which only compile for those targets.
  rust-lint:
    name: rust ${{ matrix.rust }} lint '${{ matrix.cfg }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.88", stable]
        cfg: ["", "--cfg crypto_pq_ct", "--cfg crypto_pq_portable"]
    defaults:
      run:
        shell: bash
        working-directory: rust
    env:
      RUSTFLAGS: ${{ matrix.cfg }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy,rustfmt
      - run: rustup override set ${{ matrix.rust }}
      - run: rustup target add aarch64-unknown-linux-gnu aarch64-apple-darwin aarch64-pc-windows-msvc x86_64-pc-windows-msvc
      - if: matrix.rust == 'stable' && matrix.cfg == ''
        run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: |
          for target in aarch64-unknown-linux-gnu aarch64-apple-darwin aarch64-pc-windows-msvc x86_64-pc-windows-msvc; do
            cargo clippy --all-targets --locked --target "$target" -- -D warnings
          done

  # The fallback of every CPU-specific kernel, on runners that have the instructions.
  rust-portable:
    name: rust ${{ matrix.rust }} forced portable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        rust: ["1.88", stable]
        include:
          - { os: ubuntu-24.04-arm, rust: stable }
          - { os: macos-latest, rust: stable }
    defaults:
      run:
        shell: bash
        working-directory: rust
    env:
      RUSTFLAGS: --cfg crypto_pq_portable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - run: rustup override set ${{ matrix.rust }}
      - run: cargo test --locked
      - run: cargo test --locked --release

  # Each x86-64 path whatever the runner's CPU: QEMU user mode runs the suite on a CPU with AVX2
  # and no SHA-NI, one with SHA-NI and no AVX, and one with neither. The runner itself covers the
  # CPU it has, usually SHA-NI with AVX2.
  rust-x86-models:
    name: rust x86-64 -cpu ${{ matrix.cpu }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cpu: [Haswell-v4, Denverton, qemu64]
    defaults:
      run:
        shell: bash
        working-directory: rust
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: qemu-x86_64 -cpu ${{ matrix.cpu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -q && sudo apt-get install -yq qemu-user
      - run: cargo test --locked --release -- --nocapture kernel
      - run: cargo test --locked --release

  # Every secret is marked uninitialised under valgrind's memcheck, so a branch or a memory index
  # that depends on one fails the job; values the specifications make public are declassified.
  # The crypto_pq_ct build leaves out what valgrind cannot execute (SHA-NI on x86-64; SHA3,
  # SHA512 and DIT on arm64) and detects the rest; the portable run checks the fallback.
  rust-ct:
    name: rust ${{ matrix.rust }} constant time (valgrind, ${{ matrix.os }}) '${{ matrix.cfg }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        rust: ["1.88", stable]
        cfg: ["", "--cfg crypto_pq_portable"]
        include:
          - { os: ubuntu-24.04-arm, rust: stable, cfg: "" }
          - { os: ubuntu-24.04-arm, rust: stable, cfg: "--cfg crypto_pq_portable" }
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends valgrind jq
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - run: rustup override set ${{ matrix.rust }}
      - env:
          RUSTFLAGS: --cfg crypto_pq_ct ${{ matrix.cfg }}
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: |
          binary=$(cargo test --locked --release --test ct --no-run --message-format=json | jq -r 'select(.executable != null) | .executable')
          valgrind --error-exitcode=1 -q "$binary" --test-threads=1

  # Not a gate: the CPU-specific paths against the forced fallback on GitHub's x86-64 and arm64
  # runners, printed side by side with the CPU model, so that the x86-64 kernels are measured on
  # real hardware.
  rust-bench:
    name: rust benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal
      - run: rustup override set stable
      - run: lscpu | grep -E '^(Model name|Flags)' | cut -c1-600
      - run: |
          cargo bench --locked --bench bench > "$RUNNER_TEMP/kernels.txt"
          RUSTFLAGS="--cfg crypto_pq_portable" cargo bench --locked --bench bench > "$RUNNER_TEMP/portable.txt"
          printf '%-32s %14s %14s %8s\n' case 'portable (us)' 'kernels (us)' speedup
          paste "$RUNNER_TEMP/portable.txt" "$RUNNER_TEMP/kernels.txt" |
            awk 'NF == 6 && $1 == $4 && $6 > 0 { printf "%-32s %14.3f %14.3f %7.2fx\n", $1, $3, $6, $3 / $6 }' | tee -a "$GITHUB_STEP_SUMMARY"

  zig-ct:
    name: zig 0.16.0 constant time (valgrind, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # valgrind cannot decode AVX-512, so the checked build targets x86-64-v3 (AVX2).
          - os: ubuntu-latest
            archive: zig-x86_64-linux-0.16.0.tar.xz
            sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
            cpu: x86_64_v3
          - os: ubuntu-24.04-arm
            archive: zig-aarch64-linux-0.16.0.tar.xz
            sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
            cpu: baseline
    defaults:
      run:
        shell: bash
        working-directory: zig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/${{ matrix.archive }}
          key: ${{ matrix.archive }}
      - run: |
          archive="$HOME/${{ matrix.archive }}"
          [ -f "$archive" ] || curl -fsSL --proto '=https' -o "$archive" "https://ziglang.org/download/0.16.0/${{ matrix.archive }}"
          echo "${{ matrix.sha256 }}  $archive" | sha256sum -c -
          mkdir -p ~/zig && tar -xJf "$archive" -C ~/zig --strip-components=1
          echo ~/zig >> "$GITHUB_PATH"
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends valgrind
      # -Dct=true detects features at run time only, so valgrind's view of the CPU decides: it
      # hides SHA-NI, the SHA3 instructions and DIT (and, before 3.24, SHA-512), and the code
      # takes the portable path for those. The first run checks the kernels valgrind can run
      # (AVX2 on x86-64, SHA-256 and with 3.24 SHA-512 on AArch64); the second the portable code.
      - run: zig build ct -Dct=true -Dcpu=${{ matrix.cpu }}
      - run: zig build ct -Dct=true -Dcpu=${{ matrix.cpu }} -Dportable=true


  # Not a gate: prints the benchmark for the runner's CPU, for a generic CPU (kernels chosen at
  # run time) and for the portable code, so the x86-64 kernels (SHA-NI, AVX2) and the
  # per-core Keccak choice on Arm's Neoverse runners can be measured where they run.
  zig-bench:
    name: zig benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: zig-x86_64-linux-0.16.0.tar.xz
            sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
            cpu: baseline
          - os: ubuntu-24.04-arm
            archive: zig-aarch64-linux-0.16.0.tar.xz
            sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
            cpu: generic
    defaults:
      run:
        shell: bash
        working-directory: zig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/${{ matrix.archive }}
          key: ${{ matrix.archive }}
      - run: |
          archive="$HOME/${{ matrix.archive }}"
          [ -f "$archive" ] || curl -fsSL --proto '=https' -o "$archive" "https://ziglang.org/download/0.16.0/${{ matrix.archive }}"
          echo "${{ matrix.sha256 }}  $archive" | sha256sum -c -
          mkdir -p ~/zig && tar -xJf "$archive" -C ~/zig --strip-components=1
          echo ~/zig >> "$GITHUB_PATH"
      - run: lscpu | grep -E '^(Model name|Flags)' | cut -c1-600
      - run: zig build bench -Doptimize=ReleaseFast
      - run: zig build bench -Doptimize=ReleaseFast -Dcpu=${{ matrix.cpu }}
      - run: zig build bench -Doptimize=ReleaseFast -Dportable=true

  # The forced-portable build: the purego tag leaves out every kernel and the CPU detection.
  go-purego:
    name: go purego (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: go test -tags purego ./...

  # The x86-64 paths the runner's CPU may lack, under QEMU's CPU models:
  # Skylake-Client has AVX2, BMI2 and ADX but not the SHA extensions (most Intel desktops
  # before Ice Lake); Haswell has AVX2 without ADX, so X25519 stays portable; Denverton has the
  # SHA extensions without AVX; Nehalem has none of them; max has all of them.
  go-x86-models:
    name: go x86-64 ${{ matrix.cpu }} (qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cpu: Skylake-Client-v1, kernels: "SHA extensions false, AVX2 true, MULX and ADX true" }
          - { cpu: Haswell-v1, kernels: "SHA extensions false, AVX2 true, MULX and ADX false" }
          - { cpu: Denverton-v1, kernels: "SHA extensions true, AVX2 false, MULX and ADX false" }
          - { cpu: Nehalem-v1, kernels: "SHA extensions false, AVX2 false, MULX and ADX false" }
          - { cpu: max, kernels: "SHA extensions true, AVX2 true, MULX and ADX true" }
    defaults:
      run:
        shell: bash
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends qemu-user
      - run: go test -c -o cryptopq.test .
      # The selection must match the model, or the model did not take effect.
      - run: |
          qemu-x86_64 -cpu ${{ matrix.cpu }} ./cryptopq.test -test.v -test.run TestKernelSelection | tee selection.txt
          grep -F "${{ matrix.kernels }}" selection.txt
      - run: qemu-x86_64 -cpu ${{ matrix.cpu }} ./cryptopq.test -test.timeout 90m
      # A GOAMD64=v3 binary refuses to start on a CPU without AVX2, BMI2 and FMA.
      - if: matrix.cpu == 'Skylake-Client-v1'
        run: |
          GOAMD64=v3 go test -c -o cryptopq-v3.test .
          qemu-x86_64 -cpu ${{ matrix.cpu }} ./cryptopq-v3.test -test.timeout 90m

  # Not a gate: GitHub's runners time the kernels against the portable code. No
  # other job times the x86-64 kernels, and the arm runner is a Neoverse core, which takes the
  # portable Keccak.
  go-bench:
    name: go benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    defaults:
      run:
        shell: bash
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: lscpu | grep -E '^(Model name|Flags)' | cut -c1-600
      - run: go test -v -run TestKernelSelection .
      - run: go test -run '^$' -bench 'BenchmarkPQ' -benchtime 300ms -count 3 . | tee kernels.txt
      - run: go test -tags purego -run '^$' -bench 'BenchmarkPQ' -benchtime 300ms -count 3 . | tee portable.txt

  # The C ABI's shipped artifacts (seven native libraries and five WebAssembly modules), built on
  # an x86-64 and an Arm host: the two sets must be byte-identical, which proves they come from
  # this source and this pinned Zig alone. The WebAssembly lint lists select and br_if in the
  # secret-handling functions against the reviewed allowlist.
  zig-abi-dist:
    name: zig C ABI dist (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, archive: zig-x86_64-linux-0.16.0.tar.xz, sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00 }
          - { os: ubuntu-24.04-arm, archive: zig-aarch64-linux-0.16.0.tar.xz, sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17 }
    defaults:
      run:
        shell: bash
        working-directory: zig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/${{ matrix.archive }}
          key: ${{ matrix.archive }}
      - run: |
          archive="$HOME/${{ matrix.archive }}"
          [ -f "$archive" ] || curl -fsSL --proto '=https' -o "$archive" "https://ziglang.org/download/0.16.0/${{ matrix.archive }}"
          echo "${{ matrix.sha256 }}  $archive" | sha256sum -c -
          mkdir -p ~/zig && tar -xJf "$archive" -C ~/zig --strip-components=1
          echo ~/zig >> "$GITHUB_PATH"
      - run: zig build dist
      - run: zig build wasm-lint
      - run: (cd zig-out/dist && find . -type f | LC_ALL=C sort | xargs sha256sum) | tee dist.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ runner.arch }}
          path: |
            zig/zig-out/dist
            zig/dist.sha256

  zig-abi-reproducible:
    name: zig C ABI dist is byte-identical on x86-64 and Arm hosts
    needs: zig-abi-dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
      - run: diff dist-X64/dist.sha256 dist-ARM64/dist.sha256 && cat dist-X64/dist.sha256

  # The embedded modules are what the Zig source builds, on an x86-64 and an Arm host: each host
  # rebuilds the five .wasm (zig build dist, ReleaseFast, byte-reproducible), checks them against
  # typescript/wasm/SHA256SUMS, regenerates src/wasm-*.ts and fails on any difference, and runs the
  # select/branch lint of the secret-handling functions. Both hosts matching the committed manifest
  # means they match each other.
  typescript-wasm-modules:
    name: typescript wasm modules (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: zig-x86_64-linux-0.16.0.tar.xz
            sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          - os: ubuntu-24.04-arm
            archive: zig-aarch64-linux-0.16.0.tar.xz
            sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/${{ matrix.archive }}
          key: ${{ matrix.archive }}
      - run: |
          archive="$HOME/${{ matrix.archive }}"
          [ -f "$archive" ] || curl -fsSL --proto '=https' -o "$archive" "https://ziglang.org/download/0.16.0/${{ matrix.archive }}"
          echo "${{ matrix.sha256 }}  $archive" | sha256sum -c -
          mkdir -p ~/zig && tar -xJf "$archive" -C ~/zig --strip-components=1
          echo ~/zig >> "$GITHUB_PATH"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: cd zig && zig build dist
      - run: cd zig && zig build wasm-lint
      - run: cd zig/zig-out/dist/wasm && sha256sum -c ../../../../typescript/wasm/SHA256SUMS
      - run: cd typescript && node tools/embed.ts --check ../zig/zig-out/dist/wasm

  # The whole suite with each backend on the two supported Node lines (the existing typescript job
  # keeps running npm test, which is backend "auto", on every OS and on Node 26).
  typescript-backends:
    name: typescript node ${{ matrix.node }} backend ${{ matrix.backend }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
        backend: [js, wasm, auto]
    defaults:
      run:
        shell: bash
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
        env:
          CRYPTO_PQ_BACKEND: ${{ matrix.backend }}
      - run: npm run build
      # The package carries dist/ with the five embedded modules, as base64 typed as plain strings.
      - run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const [pack] = JSON.parse(require("fs").readFileSync("pack.json", "utf8"));
            const files = pack.files.map((f) => f.path);
            for (const m of ["ml-kem", "ml-dsa", "slh-dsa", "stateful", "x-wing-hash"]) {
              if (!files.includes("dist/wasm-" + m + ".js")) throw new Error("missing dist/wasm-" + m + ".js");
            }
            if (pack.files.some((f) => f.path.endsWith(".d.ts") && f.size > 100000)) throw new Error("a declaration file embeds a module");
          '

  # Chromium, Firefox and WebKit on the main thread, each with every backend, and pages whose
  # content security policy forbids WebAssembly compilation (fallback to TypeScript, or
  # UNSUPPORTED under "wasm"). Playwright is test-only and installed in the job, not a dependency.
  typescript-browsers:
    name: typescript browsers
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.47.2-jammy@sha256:eee5be766a342139241c9a51e6449cb8f6ff2847fbd0792f91793aaf0c7f4f46
    defaults:
      run:
        shell: bash
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm install --no-save --ignore-scripts playwright-core@1.47.2
      - run: node test/browser/runner.ts
        env:
          HOME: /root

  # The cross vectors and every error code on WebAssembly and in TypeScript under Deno and Bun,
  # from their official release archives.
  typescript-engines:
    name: typescript deno and bun
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The SHA-256 pins match the checksums each project publishes with the release.
      - run: |
          curl -fsSL --proto '=https' -o ~/deno.zip https://github.com/denoland/deno/releases/download/v2.9.6/deno-x86_64-unknown-linux-gnu.zip
          curl -fsSL --proto '=https' -o ~/bun.zip https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-linux-x64.zip
          echo "394f07f4da2bebe6ce6f1e7ce0fa16429b29b08c35e3fac3fe25972676dff4b2  $HOME/deno.zip" | sha256sum -c -
          echo "36368faef7527875d5ffa52e53cd48021741f2a83eb6208a8dd64068d422a913  $HOME/bun.zip" | sha256sum -c -
          unzip -q ~/deno.zip -d ~/deno && unzip -q ~/bun.zip -d ~/bun
      - run: ~/deno/deno run --allow-read --allow-env test/engines.ts
        env:
          DENO_NO_UPDATE_CHECK: "1"
      - run: ~/bun/bun-linux-x64/bun test/engines.ts

  # The Python package's platform wheels, built by the stdlib backend from the zig-abi-dist
  # libraries (twice, byte-identical), installed on every matching runner, and run there with the
  # native and the pure backend; musl and RISC-V run in containers.
  python-wheels:
    name: python wheels
    needs: zig-abi-dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-X64
          path: dist-X64
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - working-directory: python
        run: |
          python build_backend/cpq_build.py all "$RUNNER_TEMP/one" ../dist-X64/zig-out/dist
          python build_backend/cpq_build.py all "$RUNNER_TEMP/two" ../dist-X64/zig-out/dist
          for f in "$RUNNER_TEMP"/one/*; do cmp "$f" "$RUNNER_TEMP/two/$(basename "$f")"; done
          ls -l "$RUNNER_TEMP/one" | tee -a "$GITHUB_STEP_SUMMARY"
      - working-directory: python/tests
        env:
          CRYPTO_PQ_DIST: ${{ github.workspace }}/dist-X64/zig-out/dist
          PYTHONPATH: ../src
        run: python -m unittest -v test_build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheels
          path: ${{ runner.temp }}/one

  # Each platform wheel on the runner that runs it: pip must choose it over the pure wheel, the
  # backend must be native, and the whole suite runs under both backends with the installed
  # package (the fallback, thread, wipe, differential and isolation tests included). 3.14t is the
  # free-threaded build, where the thread tests run truly in parallel.
  python-native:
    name: python ${{ matrix.python }} wheel (${{ matrix.os }})
    needs: python-wheels
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
        python: ["3.11", "3.x"]
        include:
          - { os: ubuntu-latest, python: "3.14t" }
          - { os: ubuntu-24.04-arm, python: "3.14t" }
    defaults:
      run:
        shell: bash
        working-directory: python/tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-wheels
          path: wheels
      - run: python -m pip install --no-index --find-links ../../wheels crypto-pq
      - run: python -c 'import crypto_pq, sys; print(crypto_pq.BACKEND, crypto_pq.LOAD_ERROR, crypto_pq.__file__); sys.exit(crypto_pq.BACKEND != "native")'
      - run: python -m unittest discover -s . -v
        env:
          CRYPTO_PQ_BACKEND: native
      - run: python -m unittest discover -s .
        env:
          CRYPTO_PQ_BACKEND: pure

  # musl: the same Linux wheel through its musllinux tag, in Alpine (JavaScript actions do not run
  # inside Alpine job containers on Arm, so docker runs it).
  python-musl:
    name: python wheel musl (${{ matrix.os }})
    needs: python-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-wheels
          path: wheels
      - run: |
          docker run --rm -v "$PWD:/w" -w /w/python/tests python:3.14-alpine sh -ec '
            pip install -q --root-user-action=ignore --no-index --find-links /w/wheels crypto-pq
            python -c "import crypto_pq, sys; print(crypto_pq.BACKEND, crypto_pq.LOAD_ERROR); sys.exit(crypto_pq.BACKEND != \"native\")"
            CRYPTO_PQ_BACKEND=native python -m unittest discover -s .
            CRYPTO_PQ_BACKEND=pure python -m unittest discover -s .
          '

  # riscv64, the one shipped platform that no runner has, under qemu user mode (the distribution's
  # qemu-user-static registers the binfmt handler that docker uses). The native suite only: the
  # pure one adds nothing that the other runners do not check, at twenty times the cost.
  python-riscv64:
    name: python wheel riscv64 (qemu)
    needs: python-wheels
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-wheels
          path: wheels
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends qemu-user-static
      - run: |
          docker run --rm --platform linux/riscv64 -v "$PWD:/w" -w /w/python/tests python:3.14-slim sh -ec '
            pip install -q --root-user-action=ignore --no-index --find-links /w/wheels crypto-pq
            python -c "import crypto_pq, sys; print(crypto_pq.BACKEND, crypto_pq.LOAD_ERROR); sys.exit(crypto_pq.BACKEND != \"native\")"
            CRYPTO_PQ_BACKEND=native python -m unittest discover -s .
          '

  # The package's own type check (mypy is a test-only tool here: nothing ships or builds with it).
  python-types:
    name: python mypy
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: python -m pip install mypy
      - run: |
          mypy src/crypto_pq
          MYPYPATH=src mypy build_backend/cpq_build.py
          MYPYPATH=src:tests mypy tests
