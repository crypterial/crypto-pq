name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  vectors:
    name: test vectors are unmodified
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd vectors && sha256sum -c SHA256SUMS

  check:
    name: fmt, clippy, doc, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
      - run: cargo test --workspace --release --locked

  no_std:
    name: no_std build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo build -p crypto-pq-ml-kem --target thumbv7em-none-eabihf --locked
      - run: cargo build -p crypto-pq --target thumbv7em-none-eabihf --locked

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --workspace --all-features --locked
