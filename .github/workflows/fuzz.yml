name: fuzz

# Weekly and on demand: the long robustness runs and the full vector sets take too long for every
# push.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  long:
    name: long robustness runs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CRYPTO_PQ_FUZZ: "1"
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test --locked --release --all-features --test robustness

  # The official vector sets too slow for every push (SPEC 19.4): the full ACVP ML-KEM, ML-DSA and
  # SLH-DSA sets, the ACVP large-data hashes (1 to 8 GiB per test), BLAKE2 past 4 GiB and the XMSS
  # keys with trees of 2^20 leaves (24 trees, most of the time), the tests marked #[ignore].
  # The full sets are not in the repository: the fetch tool downloads them from their pinned URLs
  # and checks every source and every file it writes against its SHA-256. CRYPTO_PQ_SLOW adds the
  # slow cases of the regular tests, such as the key of RFC 9858 A.4 with its tree of 2^20 leaves,
  # so the regular tests run too.
  rust-full-vectors:
    name: rust full vector sets (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    defaults:
      run:
        shell: bash
        working-directory: rust
    env:
      CRYPTO_PQ_SLOW: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - working-directory: .
        run: python -I tools/fetch_vectors.py --full
      - run: rustup toolchain install stable --profile minimal
      - run: rustup override set stable
      - run: cargo test --locked --release --all-features -- --include-ignored --skip xmss_reference_keys_of_height_20

  # Rebuilding the twelve XMSS keys of 2^20 leaves takes about 35 minutes on 6 ARM cores and much longer
  # on a 4-core x86 runner, so it runs as its own job with room to spare.
  rust-xmss-large-keys:
    name: rust XMSS keys of 2^20 leaves (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal
      - run: rustup override set stable
      - run: cargo test --locked --release --all-features --test stateful -- --ignored --exact xmss_reference_keys_of_height_20
