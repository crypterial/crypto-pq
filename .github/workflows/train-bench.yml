# Temporary (measurement batch of categories 4 and 6, x86-64 and ARM64): the train tree train/d
# (rust/: main 23aa5eb with PR #38 and PR #39) against main 23aa5eb (rust-main/ for blake-ab,
# rust-base/ for ab4-bench) and an A/A copy of rust/ (rust-aa/, made here). Each harness is built
# with every function of every crate at a 64-byte boundary, one codegen unit, and lld section
# shuffles: blake-ab (BLAKE2 and BLAKE3 rows against every counted rival crate, and the hash
# dispatch rows of every kind) with seeds 1 to 8 and one "alt" binary (blake2b-rs); ab4-bench (the
# SHA-2, HMAC, HKDF, LMS, XMSS and SLH-DSA-SHA2 rows of category 4) with seeds 1 to 8; rv-bench
# (the paired SHA-2 rivals) with seeds 1 to 4. Each runner first runs blake-ab's cross-check of
# every length 0 to 2 KiB and some large ones and stops unless it prints CHECK OK, then the crate's
# BLAKE and SHA-2 kernel tests natively, the latency probe and D-44's clock probe (x86-64), then
# the timing. x01 to x16 time on every core; x17 to x32 only on an Intel core, and the others
# print their CPU lines and "skip: not Intel". arm jobs a01 to a04 always time. The branch is
# deleted after the run.
name: train-bench

on:
  push:
    branches: ["bench/train-*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  ROUNDS: "16"
  AB_ARGS: "--rounds=16 --ms=20"
  RV_ARGS: "pair --rounds=6 --ms=12"
  # Every crate's functions at 64-byte boundaries (RUSTFLAGS, so the dependencies too).
  ALIGN: "-C llvm-args=-align-all-functions=6"
  # Unquoted when used: each pattern is one argument (ab4-bench: a prefix before '*', in this order;
  # rv-bench: a substring of the case name); the shell's globbing is off for them.
  AB_ROWS: "SLH-DSA-SHA2-192* SLH-DSA-SHA2-256* AA-* sha384/* sha512/* sha512_224/* sha512_256/* hmac-sha384/* hmac-sha512/* obj-hmac-sha512/* hkdf-sha384/* hkdf-sha512/* sha224/* sha256/* hmac-sha224/* hmac-sha256/* obj-hmac-sha256/* hkdf-sha256/* LMS-* HSS2-* XMSS-SHA2* XMSSMT-SHA2*"
  RV_ROWS: "sha224 sha256 sha384 sha512 SHA256 SHA2_"

jobs:
  build:
    name: build ${{ matrix.arch }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86, os: ubuntu-24.04, triple: x86_64-unknown-linux-gnu }
          - { arch: arm, os: ubuntu-24.04-arm, triple: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.99.0 --profile minimal && rustup default 1.99.0
      - name: build tools (OpenSSL headers)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libssl-dev
      - name: kernel tests and the placements of the three harnesses
        run: |
          set -euo pipefail
          cp -R rust rust-aa
          sed -i 's/^name = "crypto-pq"$/name = "crypto-pq-aa"/' rust-aa/Cargo.toml
          grep -m1 '^name' rust/Cargo.toml rust-aa/Cargo.toml rust-main/Cargo.toml rust-base/Cargo.toml
          mkdir -p "$RUNNER_TEMP/bin"
          (cd rust && CARGO_TARGET_DIR="$RUNNER_TEMP/kt" cargo test --release --locked --all-features --lib --no-run --message-format=json \
            | jq -r 'select(.executable != null) | .executable' | xargs -I{} cp {} "$RUNNER_TEMP/bin/kernel-tests")
          gcc_ld=$(rustc --print sysroot)/lib/rustlib/${{ matrix.triple }}/bin/gcc-ld
          lld="-C link-arg=-B$gcc_ld -C link-arg=-fuse-ld=lld"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/t" RUSTFLAGS="$ALIGN"
          (
            cd blake-ab
            for seed in 1 2 3 4 5 6 7 8; do
              rm -f "$RUNNER_TEMP/t/release/blake-ab"
              cargo rustc --release --locked --ignore-rust-version -- $lld "-Clink-arg=-Wl,--shuffle-sections=*=$seed" 2>&1 | tail -1
              cp "$RUNNER_TEMP/t/release/blake-ab" "$RUNNER_TEMP/bin/ab-s$seed"
            done
            rm -f "$RUNNER_TEMP/t/release/blake-ab"
            cargo rustc --release --locked --ignore-rust-version --no-default-features --features alt -- $lld "-Clink-arg=-Wl,--shuffle-sections=*=1" 2>&1 | tail -1
            cp "$RUNNER_TEMP/t/release/blake-ab" "$RUNNER_TEMP/bin/ab-alt-s1"
          )
          # ab4-bench has path dependencies only, so no lockfile.
          (
            cd ab4-bench
            for seed in 1 2 3 4 5 6 7 8; do
              rm -f "$RUNNER_TEMP/t/release/ab4-bench"
              cargo rustc --release -- $lld "-Clink-arg=-Wl,--shuffle-sections=*=$seed" 2>&1 | tail -1
              cp "$RUNNER_TEMP/t/release/ab4-bench" "$RUNNER_TEMP/bin/ab4-s$seed"
            done
          )
          (
            cd rv-bench
            for seed in 1 2 3 4; do
              rm -f "$RUNNER_TEMP/t/release/rv-bench"
              cargo rustc --release --locked -- $lld "-Clink-arg=-Wl,--shuffle-sections=*=$seed" 2>&1 | tail -1
              cp "$RUNNER_TEMP/t/release/rv-bench" "$RUNNER_TEMP/bin/rv-s$seed"
            done
          )
          for b in ab-s1 ab4-s1 rv-s1; do
            readelf -p .comment "$RUNNER_TEMP/bin/$b" | grep -i lld
          done
          sha256sum "$RUNNER_TEMP"/bin/*
          "$RUNNER_TEMP/bin/ab-s1" blake 1 | grep -E "^(CHECK|MISMATCH)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.arch }}
          path: ${{ runner.temp }}/bin

  x86:
    needs: build
    name: run x86 ${{ matrix.id }} (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        id: [x01, x02, x03, x04, x05, x06, x07, x08, x09, x10, x11, x12, x13, x14, x15, x16, x17, x18,
             x19, x20, x21, x22, x23, x24, x25, x26, x27, x28, x29, x30, x31, x32]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-x86
          path: bin
      - run: |
          {
            uname -srm
            lscpu | grep -E '^(Model name|Vendor ID|CPU family|Model:|Stepping|CPU\(s\)|L2|L3)' || true
            for f in avx2 bmi2 avx512f avx512vl sha_ni; do
              if grep -qw "$f" /proc/cpuinfo; then echo "flag $f yes"; else echo "flag $f no"; fi
            done
            chmod +x bin/*
            bin/ab-s1 check > "$RUNNER_TEMP/check.txt" 2>&1 || true
            cat "$RUNNER_TEMP/check.txt"
          } 2>&1 | tee "$RUNNER_TEMP/head.txt"
          # Outputs are compared before any timing.
          if ! grep -q '^CHECK OK' "$RUNNER_TEMP/check.txt"; then
            echo "stop: CHECK not OK"
            exit 1
          fi
          # x01 to x16 time on every core; x17 to x32 only on an Intel core.
          if [[ "${{ matrix.id }}" > x16 ]] && ! grep -q 'GenuineIntel' "$RUNNER_TEMP/head.txt"; then
            echo "skip: not Intel"
            exit 0
          fi
          set -f
          {
            cat "$RUNNER_TEMP/head.txt"
            bin/kernel-tests --test-threads=2 --nocapture blake kernel sha2 --skip one_block_kernel_shake_vectors 2>&1 | grep -E "through|BLAKE3 kernels|kernels:|test result|FAILED|panicked" || echo "RC $?"
            taskset -c 1 bin/ab-s1 probe || echo "RC $?"
            for seed in 1 2 3 4 5 6 7 8; do
              echo "SEED $seed load $(cut -d' ' -f1-3 /proc/loadavg)"
              taskset -c 1 bin/ab-s$seed blake $ROUNDS | sed "s/^/s$seed\t/" || echo "RC $?"
            done
            echo "ALT load $(cut -d' ' -f1-3 /proc/loadavg)"
            taskset -c 1 bin/ab-alt-s1 blake $ROUNDS blake2b | sed "s/^/s9\t/" || echo "RC $?"
            echo "load $(cat /proc/loadavg)"
          } 2>&1 | tee "$RUNNER_TEMP/blake.txt" | grep -E "MISMATCH|panicked|FAILED|test result|^SEED|^CLOCK" || true
          {
            cat "$RUNNER_TEMP/head.txt"
            for seed in 1 2 3 4 5 6 7 8; do
              echo "SEED $seed load $(cut -d' ' -f1-3 /proc/loadavg)"
              taskset -c 1 bin/ab4-s$seed $AB_ARGS $AB_ROWS | sed "s/^/s$seed\t/" || echo "RC $?"
            done
            echo "load $(cat /proc/loadavg)"
          } 2>&1 | tee "$RUNNER_TEMP/ab.txt" | grep -E "MISMATCH|panicked|^SEED" || true
          {
            cat "$RUNNER_TEMP/head.txt"
            for seed in 1 2 3 4; do
              echo "SEED $seed load $(cut -d' ' -f1-3 /proc/loadavg)"
              taskset -c 1 bin/rv-s$seed $RV_ARGS $RV_ROWS | sed "s/^/s$seed\t/" || echo "RC $?"
            done
            echo "load $(cat /proc/loadavg)"
          } 2>&1 | tee "$RUNNER_TEMP/raw.txt" | grep -E "MISMATCH|panicked|^SEED|CHECKS" || true
          set +f
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: raw-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/head.txt
            ${{ runner.temp }}/blake.txt
            ${{ runner.temp }}/ab.txt
            ${{ runner.temp }}/raw.txt

  arm:
    needs: build
    name: run arm ${{ matrix.id }} (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        id: [a01, a02, a03, a04]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-arm
          path: bin
      - run: |
          {
            uname -srm
            lscpu | grep -E '^(Model name|Vendor ID|CPU part|CPU\(s\)|L2|L3)' || true
            grep -m1 -o 'Features.*' /proc/cpuinfo || true
            chmod +x bin/*
            bin/ab-s1 check > "$RUNNER_TEMP/check.txt" 2>&1 || true
            cat "$RUNNER_TEMP/check.txt"
          } 2>&1 | tee "$RUNNER_TEMP/head.txt"
          # Outputs are compared before any timing.
          if ! grep -q '^CHECK OK' "$RUNNER_TEMP/check.txt"; then
            echo "stop: CHECK not OK"
            exit 1
          fi
          set -f
          {
            cat "$RUNNER_TEMP/head.txt"
            bin/kernel-tests --test-threads=2 --nocapture blake kernel sha2 --skip one_block_kernel_shake_vectors 2>&1 | grep -E "through|BLAKE3 kernels|kernels:|test result|FAILED|panicked" || echo "RC $?"
            taskset -c 1 bin/ab-s1 probe || echo "RC $?"
            for seed in 1 2 3 4 5 6 7 8; do
              echo "SEED $seed load $(cut -d' ' -f1-3 /proc/loadavg)"
              taskset -c 1 bin/ab-s$seed blake $ROUNDS | sed "s/^/s$seed\t/" || echo "RC $?"
            done
            echo "ALT load $(cut -d' ' -f1-3 /proc/loadavg)"
            taskset -c 1 bin/ab-alt-s1 blake $ROUNDS blake2b | sed "s/^/s9\t/" || echo "RC $?"
            echo "load $(cat /proc/loadavg)"
          } 2>&1 | tee "$RUNNER_TEMP/blake.txt" | grep -E "MISMATCH|panicked|FAILED|test result|^SEED" || true
          {
            cat "$RUNNER_TEMP/head.txt"
            for seed in 1 2 3 4 5 6 7 8; do
              echo "SEED $seed load $(cut -d' ' -f1-3 /proc/loadavg)"
              taskset -c 1 bin/ab4-s$seed $AB_ARGS $AB_ROWS | sed "s/^/s$seed\t/" || echo "RC $?"
            done
            echo "load $(cat /proc/loadavg)"
          } 2>&1 | tee "$RUNNER_TEMP/ab.txt" | grep -E "MISMATCH|panicked|^SEED" || true
          {
            cat "$RUNNER_TEMP/head.txt"
            for seed in 1 2 3 4; do
              echo "SEED $seed load $(cut -d' ' -f1-3 /proc/loadavg)"
              taskset -c 1 bin/rv-s$seed $RV_ARGS $RV_ROWS | sed "s/^/s$seed\t/" || echo "RC $?"
            done
            echo "load $(cat /proc/loadavg)"
          } 2>&1 | tee "$RUNNER_TEMP/raw.txt" | grep -E "MISMATCH|panicked|^SEED|CHECKS" || true
          set +f
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: raw-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/head.txt
            ${{ runner.temp }}/blake.txt
            ${{ runner.temp }}/ab.txt
            ${{ runner.temp }}/raw.txt
